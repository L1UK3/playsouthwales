name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Python version in backend/.python-version.
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
