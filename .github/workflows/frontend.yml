name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "biome.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "biome.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Biome, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the Biome version pinned in the root package.json.
      - uses: biomejs/setup-biome@v2

      # Format and import order only. The legacy frontend still has Biome lint
      # errors; drop --linter-enabled=false once they are fixed.
      - name: Biome format check
        run: biome ci frontend --linter-enabled=false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test
