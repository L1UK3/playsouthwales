name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
permissions:
    contents: read

jobs:
    backend-validation:
        name: Backend Validation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv and Set up Python
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: backend/uv.lock

            - name: Install dependencies
              run: |
                  cd backend
                  uv sync --frozen

            - name: Run Ruff Linter
              run: |
                  cd backend
                  uv run ruff check .

            - name: Check Ruff Code Format
              run: |
                  cd backend
                  uv run ruff format --check .

            - name: Run Python Tests
              run: |
                  cd backend
                  uv run pytest

    frontend-validation:
        name: Frontend Validation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: Check formatting
              run: |
                  cd frontend
                  npx prettier --check .

            - name: Run ESLint
              run: |
                  cd frontend
                  npm run lint

            - name: Build frontend
              run: |
                  cd frontend
                  npm run build
