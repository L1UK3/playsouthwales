version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
